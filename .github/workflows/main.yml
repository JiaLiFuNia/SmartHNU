name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Sign app
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: List files in the release directory for debugging
        run: ls ./app/build/outputs/apk/release/

      - name: Release Apk
        uses: ncipollo/release-action@v1
        if: contains(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref }}
          artifacts: "*.apk"
          token: ${{ github.token }}
          generateReleaseNotes: true
          body: |
            ${{ github.event.head_commit.message }}

      - name: Post to Telegram ci channel
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: |
            New CI from SmartHNU

            ```
            ${{ github.event.head_commit.message }}
            ```
        run: |
          if [ ! -z "${BOT_TOKEN}" ]; then
            if [ ! -z "${CHANNEL_ID}" ]; then
              # 查找所有 signed apk
              mapfile -t APK_FILES < <(find ./app/build/outputs/apk/release -name "*-release-signed.apk" | sort)
              echo "Debug: APK files found:"
              printf '%s\n' "${APK_FILES[@]}"

              if [ ${#APK_FILES[@]} -eq 0 ]; then
                echo "Error: No APK files found!"
                exit 1
              fi

              # 转义提交信息
              ESCAPED=$(python3 -c 'import json,os,urllib.parse; print(urllib.parse.quote(json.dumps(os.environ["COMMIT_MESSAGE"])))')

              # 构建 media JSON
              MEDIA_JSON=""
              for i in "${!APK_FILES[@]}"; do
                INDEX=$((i + 1))
                MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://file${INDEX}\",\"caption\":\"${ESCAPED}\"},"
              done
              MEDIA_JSON="[${MEDIA_JSON%,}]"  # 去掉末尾的逗号

              # 构建 curl 命令
              CURL_CMD=(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup" -F "chat_id=${CHANNEL_ID}" -F "media=${MEDIA_JSON}")
              for i in "${!APK_FILES[@]}"; do
                INDEX=$((i + 1))
                CURL_CMD+=(-F "file${INDEX}=@${APK_FILES[$i]}")
              done

              # 执行 curl
              echo "Uploading to Telegram..."
              "${CURL_CMD[@]}"
            fi
          fi
