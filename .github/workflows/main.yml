name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Sign app
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: List files in the release directory for debugging
        run: ls ./app/build/outputs/apk/release/

      - name: Release Apk
        uses: ncipollo/release-action@v1
        if: contains(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref }}
          artifacts: "*.apk"
          token: ${{ github.token }}
          generateReleaseNotes: true
          body: |
            ${{ github.event.head_commit.message }}

      - name: Post to Telegram ci channel
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: |
            New CI from SmartHNU

            ```
            ${{ github.event.head_commit.message }}
            ```
        run: |
          if [ ! -z "${BOT_TOKEN}" ]; then
            if [ ! -z "${CHANNEL_ID}" ]; then
              # 使用 find 命令查找所有符合条件的 release-signed.apk 文件
              APK_FILES=$(find ./app/build/outputs/apk/release -name "*-release-signed.apk")
              echo "Debug: APK files found: $APK_FILES"

              # 检查是否找到了文件
              if [ -z "$APK_FILES" ]; then
                echo "Error: No APK files found!"
                exit 1
              fi

              # 转义提交信息
              ESCAPED=$(python3 -c 'import json,os,urllib.parse; print(urllib.parse.quote(json.dumps(os.environ["COMMIT_MESSAGE"])))')

              # 构建 media 参数
              MEDIA_JSON=""
              INDEX=1
              for APK in $APK_FILES; do
                MEDIA_JSON="${MEDIA_JSON}{\"type\":\"document\",\"media\":\"attach://file${INDEX}\",\"caption\":\"${ESCAPED}\"},"
                INDEX=$((INDEX+1))
              done

              # 去掉末尾的逗号
              MEDIA_JSON="${MEDIA_JSON%,}"

              # 上传文件
              FILE_INDEX=1
              for APK in $APK_FILES; do
                curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup" \
                  -F "chat_id=${CHANNEL_ID}" \
                  -F "media=[${MEDIA_JSON}]" \
                  -F "file${FILE_INDEX}=@${APK}"
                FILE_INDEX=$((FILE_INDEX+1))
              done
            fi
          fi