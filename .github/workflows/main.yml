name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Sign app
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: List files in the release directory for debugging
        run: ls ./app/build/outputs/apk/release/

      - name: Release Apk
        uses: ncipollo/release-action@v1
        if: contains(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref }}
          artifacts: "*.apk"
          token: ${{ github.token }}
          generateReleaseNotes: true
          body: |
            ${{ github.event.head_commit.message }}

      - name: Post to Telegram ci channel
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: |
            New CI from SmartHNU
            
            ```
            ${{ github.event.head_commit.message }}
            ```
        run: |
          if [ ! -z "${BOT_TOKEN}" ]; then
            if [ ! -z "${CHANNEL_ID}" ]; then
              RELEASES=$(find ./app/build/outputs/apk/release -name "*-release-signed.apk")
              echo "Debug: RELEASE paths are $RELEASES"

              if [ ! -z "$RELEASES" ]; then
                ESCAPED=$(python3 -c 'import json,os,urllib.parse; print(urllib.parse.quote(json.dumps(os.environ["COMMIT_MESSAGE"])))')
                MEDIA=""
                for RELEASE in $RELEASES; do
                  MEDIA="$MEDIA%7B%22type%22%3A%22document%22%2C%22media%22%3A%22attach%3A%2F%2F$(basename $RELEASE)%22%7D%2C"
                  curl -F "$(basename $RELEASE)=@$RELEASE" "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHANNEL_ID}&media=%5B$MEDIA%5D"
                done
              else
                echo "Error: No APK files found in release directory"
                exit 1
              fi
            fi
          fi
